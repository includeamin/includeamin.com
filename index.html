<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amin Jamal - Tech Lead at Bayer AG</title>
    <meta name="description" content="Amin Jamal, Tech Lead at Bayer AG in Düsseldorf. Domain-driven design, solution architecture, and open-source engineering in Rust and Python.">
    <meta name="keywords" content="Amin Jamal, senior software engineer, tech lead, Bayer, Düsseldorf, digital agriculture, system design, software development">
    <meta name="author" content="Amin Jamal">
    <link rel="canonical" href="https://includeamin.com">
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="Amin Jamal - Tech Lead at Bayer AG">
    <meta property="og:description" content="Tech Lead at Bayer AG, Düsseldorf. Domain-driven design, solution architecture, and open-source engineering.">
    <meta property="og:url" content="https://includeamin.com">
    <meta property="og:type" content="website">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Amin Jamal - Tech Lead at Bayer AG">
    <meta name="twitter:description" content="Tech Lead at Bayer AG, Düsseldorf. Domain-driven design, solution architecture, and open-source engineering.">
    <!-- Preload font for speed -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" as="style" onload="this.rel='stylesheet'">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --phosphor: #33ff33;
            --phosphor-dim: #1a7a1a;
            --phosphor-glow: rgba(51, 255, 51, 0.15);
            --bg: #0a0a0a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            overflow-x: hidden;
        }

        /* CRT screen wrapper */
        .crt {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            overflow: hidden;
        }

        /* Scanlines overlay */
        .crt::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.25) 2px,
                rgba(0, 0, 0, 0.25) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Vignette + screen-edge darkening */
        .crt::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 60%,
                rgba(0,0,0,0.55) 100%
            );
            pointer-events: none;
            z-index: 11;
        }

        /* Subtle flicker */
        @keyframes flicker {
            0%   { opacity: 1; }
            92%  { opacity: 1; }
            93%  { opacity: 0.94; }
            94%  { opacity: 1; }
            96%  { opacity: 0.97; }
            100% { opacity: 1; }
        }

        .terminal {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 24px 64px;
            color: var(--phosphor);
            font-size: 15px;
            line-height: 1.75;
            text-align: left;
            animation: flicker 6s infinite;
            /* phosphor text glow */
            text-shadow:
                0 0 3px var(--phosphor),
                0 0 8px var(--phosphor-glow);
        }

        #output {
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 15px;
            background: var(--phosphor);
            vertical-align: middle;
            box-shadow: 0 0 6px var(--phosphor);
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        a {
            color: #aaffaa;
            text-decoration: none;
            text-shadow:
                0 0 3px #aaffaa,
                0 0 10px rgba(170, 255, 170, 0.3);
        }

        a:hover {
            color: #fff;
            text-shadow: 0 0 6px #fff, 0 0 14px rgba(255,255,255,0.4);
        }

        @media (max-width: 600px) {
            .terminal {
                font-size: 13px;
                padding: 32px 16px 48px;
            }
        }
    </style>
</head>
<body>
<div class="crt">
<div class="terminal">
    <div id="output"></div>
    <span class="cursor"></span>
</div>
</div>
<script>
    const output = document.getElementById('output');
    const cursor = document.querySelector('.cursor');

    const terminalContent = `
$ whoami
Amin Jamal - Tech Lead @ Bayer AG

$ cat about.txt
Tech Lead at Bayer AG, Düsseldorf. Building scalable systems for digital
agriculture with a focus on domain-driven design and solution architecture.
Co-founder of Jaan. NIT alumnus. Rust & Python practitioner.

$ cat experience.txt
2025 – Present   Tech Lead, ResiYou @ Bayer AG
2021 – Present   Various roles @ Bayer AG (4y 9m total)
2023 – 2024      Senior Software Engineer @ Grey Rook GmbH
2019 – 2022      CTO @ KELID Online Academy
2016 – 2020      Senior Developer & Co-Founder @ Handmade Interactive Entertainment
2020 – Present   Co-Founder @ Jaan

$ cat skills.txt
Languages : Rust, Python, Go
Focus     : Domain-Driven Design, Solution Architecture, Distributed Systems
Open-Source: Contributor to FastAPI (98k+ stars)

$ ls projects/
openapi-aggregator/   m3u8-parser/   diff/

$ cat projects/openapi-aggregator/README.md
Rust CLI + library for aggregating and merging OpenAPI 3.x specs from
multiple sources (files, HTTP). Supports conflict resolution, path
prefixing, and $ref rewriting.
→ https://github.com/includeamin/openapi-aggregator

$ cat projects/m3u8-parser/README.md
Rust crate for parsing and generating M3U8 (HLS) playlists,
fully compliant with RFC 8216.
→ https://github.com/includeamin/m3u8-parser

$ cat contact.txt
Email     : info@includeamin.com
LinkedIn  : https://www.linkedin.com/in/includeamin
GitHub    : https://github.com/includeamin
`;

    let index = 0;

    function type() {
        if (index < terminalContent.length) {
            const char = terminalContent.charAt(index);
            if (char === '\n') {
                output.innerHTML += '<br>';
            } else if (terminalContent.slice(index).startsWith('https://') || terminalContent.slice(index).startsWith('mailto:')) {
                let urlEnd = terminalContent.indexOf('\n', index);
                if (urlEnd === -1) urlEnd = terminalContent.length;
                const url = terminalContent.slice(index, urlEnd);
                const displayText = url.startsWith('mailto:') ? url.replace('mailto:', '') : url;
                output.innerHTML += `<a href="${url}" target="_blank">${displayText}</a>`;
                index = urlEnd - 1;
            } else {
                output.innerHTML += char;
            }
            index++;
            setTimeout(type, 40);
        } else {
            cursor.style.display = 'inline-block';
        }
    }

    type();
</script>
</body>
</html>
