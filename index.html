<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amin Jamal - Senior Software Engineer & Tech Lead</title>
    <meta name="description" content="Amin Jamal, Senior Software Engineer and Tech Lead at Bayer in Düsseldorf, designs scalable systems for digital agriculture. Explore my expertise in system design and leadership.">
    <meta name="keywords" content="Amin Jamal, senior software engineer, tech lead, Bayer, Düsseldorf, digital agriculture, system design, software development">
    <meta name="author" content="Amin Jamal">
    <link rel="canonical" href="https://includeamin.com">
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="Amin Jamal - Senior Software Engineer & Tech Lead">
    <meta property="og:description" content="Senior Software Engineer and Tech Lead at Bayer, Düsseldorf. Specializing in scalable systems for digital agriculture.">
    <meta property="og:url" content="https://includeamin.com">
    <meta property="og:type" content="website">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Amin Jamal - Senior Software Engineer & Tech Lead">
    <meta name="twitter:description" content="Senior Software Engineer and Tech Lead at Bayer, Düsseldorf. Specializing in scalable systems for digital agriculture.">
    <!-- Preload font for speed -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" as="style" onload="this.rel='stylesheet'">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            font-family: 'Ubuntu Mono', 'Courier New', monospace;
        }

        .terminal {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            color: #00FF00;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
        }

        #output {
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #00FF00;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        a {
            color: #FFFFFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .terminal {
                font-size: 14px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
<div class="terminal">
    <div id="output"></div>
    <span class="cursor"></span>
</div>
<script>
    const output = document.getElementById('output');
    const cursor = document.querySelector('.cursor');

    const terminalContent = `
$ whoami
Amin Jamal - Senior Software Engineer/Tech Lead

$ cat about.txt
Senior Software Engineer and Tech Lead at Bayer, based in Düsseldorf. I design scalable systems to revolutionize digital agriculture, merging technical mastery with team leadership to drive precision farming solutions. Passionate about system design and mentorship, I turn complex data challenges into elegant code. NIT-educated, always innovating.

$ cat contact.txt
Email: info@includeamin.com
LinkedIn: https://www.linkedin.com/in/includeamin
GitHub: https://github.com/includeamin
`;

    let index = 0;

    function type() {
        if (index < terminalContent.length) {
            const char = terminalContent.charAt(index);
            if (char === '\n') {
                output.innerHTML += '<br>';
            } else if (terminalContent.slice(index).startsWith('https://') || terminalContent.slice(index).startsWith('mailto:')) {
                let urlEnd = terminalContent.indexOf('\n', index);
                if (urlEnd === -1) urlEnd = terminalContent.length;
                const url = terminalContent.slice(index, urlEnd);
                const displayText = url.startsWith('mailto:') ? url.replace('mailto:', '') : url;
                output.innerHTML += `<a href="${url}" target="_blank">${displayText}</a>`;
                index = urlEnd - 1;
            } else {
                output.innerHTML += char;
            }
            index++;
            setTimeout(type, 40);
        } else {
            cursor.style.display = 'inline-block';
        }
    }

    type();
</script>
</body>
</html>
